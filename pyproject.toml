[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtsk"
version = "0.1.1"
description = "Slovak S-JTSK (JTSK, JTSK03) ↔ ETRS89 / WGS 84 coordinate transformations the official ÚGKK way, with the GKÚ grid included"
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "src/sjtsk/data/sk_gku_LICENSE.txt"]
requires-python = ">=3.10"
authors = [
  { name = "Šimon Saloň", email = "simon.salon@tuzvo.sk" },
  { name = "Milan Koreň" },
  { name = "František Chudý" },
  { name = "Julián Tomaštík" },
  { name = "Miroslav Kardoš" },
]
keywords = ["S-JTSK", "JTSK03", "ETRS89", "Krovak", "Slovakia", "coordinate transformation", "PROJ", "geodesy", "gis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.24", "pyproj>=3.5"]

[project.optional-dependencies]
geo = ["shapely>=2.0", "geopandas>=1.0"]
test = ["pytest>=8", "shapely>=2.0", "geopandas>=1.0", "rasterio>=1.3"]

[project.urls]
Homepage = "https://github.com/SimonSalon25/sjtsk"
Issues = "https://github.com/SimonSalon25/sjtsk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sjtsk = ["data/*.tif", "data/*.txt"]
